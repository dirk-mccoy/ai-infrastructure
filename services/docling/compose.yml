services:
  docling:
    image: quay.io/docling-project/docling-serve:latest
    container_name: docling
    restart: unless-stopped

    ports:
      - "5001:5001"

    environment:
      DOCLING_SERVE_ENABLE_UI: "true"
      DOCLING_SERVE_MAX_SYNC_WAIT: "600"
      UVICORN_WORKERS: "1"
      OMP_NUM_THREADS: "4"

    networks:
      - ai-network

networks:
  ai-network:
    external: true