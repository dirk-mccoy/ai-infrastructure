services:
  open-webui:
    image: 	ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    restart: unless-stopped
    ports:
      - "3000:8080"
    volumes:
      - /opt/ai/data/open-webui:/app/backend/data
    
    networks:
      - ai-network

    environment:
      OLLAMA_BASE_URL: "http://ollama:11434"

networks:
  ai-network:
    external: true