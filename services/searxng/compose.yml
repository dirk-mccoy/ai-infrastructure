services:
  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    restart:  unless-stopped
    ports:
      - "8088:8080"
    environment:
      SEARXNG_DEFAULT_PAGE_LEN: "5"
      UWSGI_THREADS: "3"
    volumes:
      - ./searxng/config:/etc/searxng
      - ./searxng/cache:/var/cache/searxng
    networks:
      - ai-network
    
networks:
  ai-network:
    external: true
  